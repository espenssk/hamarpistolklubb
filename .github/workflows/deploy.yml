name: Deploy to GitHub Pages

# Builds and publishes the site automatically whenever changes are pushed
# to master - no FTP, no manual upload. See DEPLOYMENT.md for the
# one-time setup steps (enabling Pages + pointing the domain's DNS here).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install, build, and upload the Astro site
        uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853 # v6.1.2
        with:
          node-version: "22"
        env:
          # TODO: remove SITE_URL/BASE_PATH once testing moves off the GitHub
          # Pages project URL (espenssk.github.io/hps-homepage/) and onto the
          # custom domain, which is served from "/" and needs no base path.
          SITE_URL: https://espenssk.github.io
          BASE_PATH: /hps-homepage/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
